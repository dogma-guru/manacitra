   </g>
   <g id="text_6">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans Mono'; text-anchor: start; fill: #52514e" x="185.76" y="91.396344" transform="rotate(-0 185.76 91.396344)">results arrive</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(185.76 115.58025)">The file stays as it was;</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(185.76 127.90025)">changing it now would</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(185.76 140.22025)">break step 4.</text>
   </g>
   <g id="line2d_4">
    <g clip-path="url(#pc224103cec)">
     <use xlink:href="#mb9ff36c3fb" x="352.044" y="65.412" style="fill: #3987e5; stroke: #fcfcfb; stroke-width: 2"/>
    </g>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="347.58" y="37.941539" transform="rotate(-0 347.58 37.941539)">3  Reveal the salt</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans Mono'; text-anchor: start; fill: #52514e" x="347.58" y="91.396344" transform="rotate(-0 347.58 91.396344)">manacitra reveal p.md</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(347.58 116.43275)">Publishes the file and</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(347.58 127.90025)">its salt, so anyone</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(347.58 141.07275)">can check.</text>
   </g>
   <g id="line2d_5">
    <g clip-path="url(#pc224103cec)">
