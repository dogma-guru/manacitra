    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="509.4" y="37.941539" transform="rotate(-0 509.4 37.941539)">4  Anyone verifies</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans Mono'; text-anchor: start; fill: #52514e" x="509.4" y="91.350656" transform="rotate(-0 509.4 91.350656)">manacitra verify p.md</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(509.4 115.58025)">MATCH: the predictions</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(509.4 128.75275)">came before the results.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #8a8985" transform="translate(23.94 188.017875)">The hash in step 1 is SHA-256 of a secret random salt followed by the file, so a short prediction cannot be guessed from it.</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #8a8985" transform="translate(23.94 199.777875)">Where the hash is posted, and the Sigstore signature on the commit record (a public log entry naming this repository's</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #8a8985" transform="translate(23.94 211.857469)">workflow, with its time), show who sealed it and when.</text>
   </g>
